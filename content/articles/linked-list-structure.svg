<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#1c2434}
      .title{font-size:20px;font-weight:700}
      .h{font-size:18px;font-weight:650}
      .cell{font-size:14px}
      .small{font-size:12px;fill:#5a6478}
      .label{font-size:13px;fill:#5a6478}
      .node{fill:#e6f6ec;stroke:#2a8050;stroke-width:2}
      .ptr{fill:#f6f7f9;stroke:#9aa4b5;stroke-width:1.5}
      .line{stroke:#6b7687;stroke-width:2.2;fill:none;marker-end:url(#a)}
      .headline{stroke:#2a8050;stroke-width:2.2;fill:none;marker-end:url(#ag)}
      .sep{stroke:#dde2ea;stroke-width:1.5}
      .idx{font-size:13px;font-weight:650;fill:#2a8050}
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7687"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a8050"/>
    </marker>
  </defs>

  <rect width="1000" height="420" fill="#ffffff"/>
  <text x="36" y="46" class="title">Связный список: узлы и ссылки</text>
  <text x="36" y="76" class="label">Книги стоят вразнобой, но в каждой лежит закладка с адресом следующей</text>

  <!-- head: переменная со ссылкой на первый узел -->
  <text x="36" y="122" class="small">переменная</text>
  <rect x="36" y="136" width="86" height="64" rx="6" fill="#ffffff" stroke="#2a8050" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="84" y="163" class="idx" text-anchor="middle">head</text>
  <circle cx="84" cy="182" r="5" fill="#2a8050"/>
  <path d="M84,182 L142,182" class="line"/>


  <!-- ============ УЗЕЛ 1 ============ -->
  <text x="160" y="122" class="small">Узел 1</text>
  <rect x="160" y="136" width="194" height="64" rx="6" class="node"/>
  <line x1="305" y1="136" x2="305" y2="200" stroke="#2a8050" stroke-width="2"/>
  <text x="233" y="163" class="cell" text-anchor="middle">«Война</text>
  <text x="233" y="183" class="cell" text-anchor="middle">и мир»</text>
  <text x="330" y="163" class="small" text-anchor="middle">next</text>
  <circle cx="330" cy="180" r="5" fill="#2a8050"/>

  <path d="M330,180 L413,180" class="line"/>

  <!-- ============ УЗЕЛ 2 ============ -->
  <text x="422" y="122" class="small">Узел 2</text>
  <rect x="422" y="136" width="194" height="64" rx="6" class="node"/>
  <line x1="567" y1="136" x2="567" y2="200" stroke="#2a8050" stroke-width="2"/>
  <text x="495" y="163" class="cell" text-anchor="middle">«Преступление</text>
  <text x="495" y="183" class="cell" text-anchor="middle">и наказание»</text>
  <text x="592" y="163" class="small" text-anchor="middle">next</text>
  <circle cx="592" cy="180" r="5" fill="#2a8050"/>

  <path d="M592,180 L675,180" class="line"/>

  <!-- ============ УЗЕЛ 3 ============ -->
  <text x="684" y="122" class="small">Узел 3</text>
  <rect x="684" y="136" width="194" height="64" rx="6" class="node"/>
  <line x1="829" y1="136" x2="829" y2="200" stroke="#2a8050" stroke-width="2"/>
  <text x="757" y="163" class="cell" text-anchor="middle">«Анна</text>
  <text x="757" y="183" class="cell" text-anchor="middle">Каренина»</text>
  <text x="854" y="163" class="small" text-anchor="middle">next</text>
  <circle cx="854" cy="180" r="5" fill="#2a8050"/>

  <path d="M854,180 L914,180" class="line"/>
  <rect x="917" y="162" width="47" height="36" rx="6" class="ptr"/>
  <text x="941" y="185" class="cell" text-anchor="middle">NULL</text>

  <line x1="120" y1="248" x2="957" y2="248" class="sep"/>

  <!-- ============ СЛЕДСТВИЯ ============ -->
  <text x="120" y="284" class="h">Что из этого следует</text>

  <circle cx="128" cy="313" r="4" fill="#2a8050"/>
  <text x="146" y="318" class="cell">Узлы разбросаны по памяти: соседние по списку книги могут лежать в разных её концах.</text>

  <circle cx="128" cy="345" r="4" fill="#2a8050"/>
  <text x="146" y="350" class="cell">Каждый узел знает только следующего — общей нумерации нет.</text>

  <circle cx="128" cy="377" r="4" fill="#2a8050"/>
  <text x="146" y="382" class="cell">Чтобы добраться до третьего элемента, нужно пройти через первый и второй: O(n).</text>
</svg>
