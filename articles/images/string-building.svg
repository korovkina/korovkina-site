<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#1c2434}
      .title{font-size:20px;font-weight:700}
      .h{font-size:18px;font-weight:650}
      .cell{font-size:14px}
      .mono{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:13px}
      .small{font-size:12px;fill:#5a6478}
      .label{font-size:13px;fill:#5a6478}
      .copy{fill:#fbe9e2;stroke:#c0561a;stroke-width:1.8}
      .keep{fill:#e6f6ec;stroke:#2a8050;stroke-width:1.8}
      .box{fill:#f6f7f9;stroke:#9aa4b5;stroke-width:1.5}
      .sep{stroke:#dde2ea;stroke-width:1.5}
      .bad{fill:#b4531a;font-size:15px;font-weight:650}
      .good{fill:#1f7a46;font-size:15px;font-weight:650}
      .line{stroke:#6b7687;stroke-width:2;fill:none;marker-end:url(#a)}
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7687"/>
    </marker>
  </defs>

  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="36" y="46" class="title">Сборка строки: по фрагменту против одной операции</text>
  <text x="36" y="74" class="label">Строка неизменяема, поэтому «дописать» к ней нельзя — можно только создать новую</text>

  <!-- ============ ЛЕВАЯ ЧАСТЬ: КОНКАТЕНАЦИЯ ============ -->
  <text x="36" y="118" class="bad">Конкатенация в цикле</text>
  <text x="36" y="140" class="mono">result += "a"  →  result += "b"  →  …</text>

  <text x="36" y="176" class="small">каждый шаг копирует всё, что накоплено:</text>

  <!-- шаг 1 -->
  <text x="36" y="206" class="small">шаг 1</text>
  <rect x="92" y="192" width="30" height="24" rx="4" class="copy"/>
  <text x="107" y="209" class="mono" text-anchor="middle">a</text>
  <text x="140" y="209" class="small">копируем 1 символ</text>

  <!-- шаг 2 -->
  <text x="36" y="240" class="small">шаг 2</text>
  <rect x="92" y="226" width="30" height="24" rx="4" class="copy"/>
  <rect x="122" y="226" width="30" height="24" rx="4" class="copy"/>
  <text x="107" y="243" class="mono" text-anchor="middle">a</text>
  <text x="137" y="243" class="mono" text-anchor="middle">b</text>
  <text x="170" y="243" class="small">копируем 2 символа</text>

  <!-- шаг 3 -->
  <text x="36" y="274" class="small">шаг 3</text>
  <rect x="92" y="260" width="30" height="24" rx="4" class="copy"/>
  <rect x="122" y="260" width="30" height="24" rx="4" class="copy"/>
  <rect x="152" y="260" width="30" height="24" rx="4" class="copy"/>
  <text x="107" y="277" class="mono" text-anchor="middle">a</text>
  <text x="137" y="277" class="mono" text-anchor="middle">b</text>
  <text x="167" y="277" class="mono" text-anchor="middle">c</text>
  <text x="200" y="277" class="small">копируем 3 символа</text>

  <!-- шаг 4 -->
  <text x="36" y="308" class="small">шаг 4</text>
  <rect x="92" y="294" width="30" height="24" rx="4" class="copy"/>
  <rect x="122" y="294" width="30" height="24" rx="4" class="copy"/>
  <rect x="152" y="294" width="30" height="24" rx="4" class="copy"/>
  <rect x="182" y="294" width="30" height="24" rx="4" class="copy"/>
  <text x="107" y="311" class="mono" text-anchor="middle">a</text>
  <text x="137" y="311" class="mono" text-anchor="middle">b</text>
  <text x="167" y="311" class="mono" text-anchor="middle">c</text>
  <text x="197" y="311" class="mono" text-anchor="middle">d</text>
  <text x="230" y="311" class="small">копируем 4 символа</text>

  <text x="36" y="352" class="bad">1 + 2 + 3 + 4 = 10 операций  →  O(n²)</text>

  <!-- разделитель -->
  <line x1="500" y1="100" x2="500" y2="380" class="sep"/>

  <!-- ============ ПРАВАЯ ЧАСТЬ: JOIN ============ -->
  <text x="540" y="118" class="good">Собрать и объединить</text>
  <text x="540" y="140" class="mono">result = join(["a", "b", "c", "d"])</text>

  <text x="540" y="176" class="small">фрагменты лежат отдельно, копирования нет:</text>

  <rect x="540" y="192" width="40" height="30" rx="4" class="box"/>
  <rect x="588" y="192" width="40" height="30" rx="4" class="box"/>
  <rect x="636" y="192" width="40" height="30" rx="4" class="box"/>
  <rect x="684" y="192" width="40" height="30" rx="4" class="box"/>
  <text x="560" y="212" class="mono" text-anchor="middle">a</text>
  <text x="608" y="212" class="mono" text-anchor="middle">b</text>
  <text x="656" y="212" class="mono" text-anchor="middle">c</text>
  <text x="704" y="212" class="mono" text-anchor="middle">d</text>

  <path d="M632,232 L632,264" class="line"/>
  <text x="648" y="254" class="small">один проход: сначала считаем длину, потом копируем</text>

  <rect x="540" y="272" width="184" height="32" rx="5" class="keep"/>
  <text x="632" y="293" class="mono" text-anchor="middle">a b c d</text>

  <text x="540" y="352" class="good">4 операции  →  O(n)</text>

  <line x1="36" y1="400" x2="964" y2="400" class="sep"/>

  <!-- ============ ИНСТРУМЕНТЫ ============ -->
  <text x="36" y="436" class="h">Приём один, инструмент зависит от языка</text>

  <rect x="36" y="456" width="216" height="60" rx="6" class="box"/>
  <text x="144" y="480" class="cell" text-anchor="middle" font-weight="650">Python</text>
  <text x="144" y="502" class="mono" text-anchor="middle">"".join(parts)</text>

  <rect x="268" y="456" width="216" height="60" rx="6" class="box"/>
  <text x="376" y="480" class="cell" text-anchor="middle" font-weight="650">Java</text>
  <text x="376" y="502" class="mono" text-anchor="middle">StringBuilder</text>

  <rect x="500" y="456" width="216" height="60" rx="6" class="box"/>
  <text x="608" y="480" class="cell" text-anchor="middle" font-weight="650">Go</text>
  <text x="608" y="502" class="mono" text-anchor="middle">strings.Builder</text>

  <rect x="732" y="456" width="216" height="60" rx="6" class="box"/>
  <text x="840" y="480" class="cell" text-anchor="middle" font-weight="650">JavaScript</text>
  <text x="840" y="502" class="mono" text-anchor="middle">parts.join("")</text>
</svg>
