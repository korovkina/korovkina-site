<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Такой страницы нет — Татьяна Коровкина</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="/styles.css">
  <script src="/site.js" defer></script>
  <style>
    .lost { min-height: 70vh; display: grid; align-content: center; padding-block: 64px; }
    .lost-art { width: min(320px, 80%); height: auto; color: var(--brand); margin-bottom: 36px; overflow: visible; }
    .lost-art .swim { color: var(--fish-color, var(--brand)); }
    .lost-art .bubble { fill: none; stroke: currentColor; stroke-width: 1.4; }
    .lost .lead code { font-size: 0.9em; background: var(--soft); padding: 1px 6px; border-radius: 5px; }
    .lost .en { color: var(--muted); margin: 10px 0 0; }
    @media (prefers-reduced-motion: no-preference) {
      .lost-art .swim { animation: swim 6s ease-in-out infinite; }
      @keyframes swim { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(14px, -5px); } }
    }
  </style>
</head>
<body>
  <a class="skip" href="#main">Перейти к содержанию</a>
  <header class="site-head">
    <div class="wrap head-row">
      <nav aria-label="Разделы сайта">
        <ol class="chain">
          <li><a class="head" href="/">head</a></li>
          <li><a href="/#about">Обо мне</a></li>
          <li><a href="/#course">Курс</a></li>
          <li><a href="/#mentoring">Занятия</a></li>
          <li><a href="/talks/">Выступления</a></li>
          <li><a href="/articles/">Статьи</a></li>
          <li><span class="none">None</span></li>
        </ol>
      </nav>
      <div class="head-tools">
        <div class="theme-switch" role="group" aria-label="Тема оформления" hidden>
          <button type="button" data-theme-set="light" aria-pressed="false" aria-label="Светлая тема" title="Светлая тема"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg></button>
          <button type="button" data-theme-set="dark" aria-pressed="false" aria-label="Тёмная тема" title="Тёмная тема"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 14.6A8 8 0 1 1 9.4 4.5a6.4 6.4 0 0 0 10.1 10.1Z"/></svg></button>
        </div>
        <nav class="lang-switch" aria-label="Язык сайта">
          <span aria-current="true">RU</span>
          <a href="/en/" hreflang="en" lang="en">EN</a>
        </nav>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="wrap lost">
      <!-- нода, указатель next в пустоту и уплывающая рыба -->
      <svg class="lost-art" viewBox="0 0 320 120" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
          <rect x="2" y="42" width="96" height="40" rx="8"/>
          <path d="M64 42V82"/>
          <circle cx="81" cy="62" r="4" fill="currentColor"/>
          <path d="M98 62H150" stroke-dasharray="5 6"/>
        </g>
        <g class="swim">
          <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" transform="translate(178 30) scale(4)">
            <path d="M7 9C10.5 3.5 19 3 26.5 9C19 15 10.5 14.5 7 9ZM7 9L2 4.5V13.5Z" stroke-width="0.6"/>
            <path d="M14.5 5.8Q13 9 14.5 12.2" stroke-width="0.55"/>
            <circle cx="21.5" cy="8" r="1.1" fill="currentColor" stroke="none"/>
          </g>
          <circle class="bubble" cx="300" cy="30" r="5"/>
          <circle class="bubble" cx="312" cy="12" r="3"/>
        </g>
      </svg>
      <p class="eyebrow">404</p>
      <h1 class="page-title">Такой страницы нет</h1>
      <p class="en" lang="en">Page not found.</p>
      <!-- бинарный поиск запрошенного адреса по страницам сайта (site.js); список держать отсортированным и дополнять при новых открытых страницах (закрытые сюда не писать) -->
      <div class="lost-search" hidden data-pages='["/", "/articles/", "/articles/arrays-strings-linked-lists/", "/articles/complexity-advanced/", "/articles/complexity/", "/articles/sorting/", "/en/", "/talks/"]'></div>
      <div class="actions">
        <a class="btn primary" href="/">На главную</a>
        <a class="btn ghost" href="/articles/">Статьи</a>
      </div>
    </section>
  </main>

  <footer class="site-foot">
    <div class="wrap">
      <span>© 2026 Татьяна Коровкина</span>
      <span class="mono">next → None</span>
    </div>
  </footer>
</body>
</html>
